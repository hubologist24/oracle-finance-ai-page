
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Vibrant Blue Gradient for the 'D' -->
    <linearGradient id="dGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    
    <!-- Sparkle/AI Node Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00FFFF" />
    </linearGradient>
    
    <!-- Native SVG Glow Filter for the AI Touch -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <g transform="translate(100, 40)">
    <!-- ================= LOGO MARK (HD) ================= -->
    
    <!-- Tech Lines & Circuit Nodes (Left side) -->
    <!-- Top Line & Square Nodes -->
    <path d="M 180 130 H 220 V 160 H 260" stroke="#0072FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="174" y="114" width="16" height="16" rx="4" fill="#0072FF" />
    <rect x="204" y="94" width="18" height="18" rx="4" fill="#0072FF" />

    <!-- Middle Line 1 (Circular Node) -->
    <path d="M 170 170 H 260" stroke="#0072FF" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="165" cy="170" r="10" fill="#0072FF" />

    <!-- Middle Line 2 (Circular Node) -->
    <path d="M 150 210 H 260" stroke="#0072FF" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="145" cy="210" r="10" fill="#0072FF" />

    <!-- Bottom Pill Node -->
    <rect x="206" y="226" width="26" height="14" rx="7" fill="#0072FF" />

    <!-- The 'H' Structure (Deep Navy) -->
    <path d="M 260 90 H 320 V 162 H 410 V 90 H 440 V 170 C 420 180, 410 190, 410 210 V 310 H 260 Z" fill="#0A1931"/>
    
    <!-- The 'D' Structure (Dynamic Blue Gradient) -->
    <path d="M 410 90 C 470 90, 650 90, 650 200 C 650 310, 490 310, 410 310 C 445 280, 465 255, 465 210 C 465 165, 430 162, 410 162 Z" fill="url(#dGradient)"/>
    
    <!-- 3D Ribbon Fold Overlay -->
    <path d="M 410 90 L 470 150 L 410 162 Z" fill="#0052D4" opacity="0.45"/>

    <!-- MY TOUCH: Glowing AI Sparkle Core Node -->
    <g transform="translate(515, 235)" filter="url(#nodeGlow)">
      <path d="M 0 -22 L 5 -5 L 22 0 L 5 5 L 0 22 L -5 5 L -22 0 L -5 -5 Z" fill="url(#sparkleGrad)" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
    </g>
    
    <!-- ================= TYPOGRAPHY ================= -->
    
    <!-- Primary Brand Name: HADOTECH -->
    <g font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="76">
      <!-- "H" -->
      <text x="30" y="440" fill="#0A1931" letter-spacing="12">H</text>
      
      <!-- Stylized Custom 'A' (Modern Tech Chevron) -->
      <path d="M 132 440 L 167 372 L 202 440 L 186 440 L 167 402 L 148 440 Z" fill="#0A1931" />
      
      <!-- "DO" -->
      <text x="220" y="440" fill="#0A1931" letter-spacing="12">DO</text>
      
      <!-- "TECH" -->
      <text x="475" y="440" fill="#0072FF" letter-spacing="12">TECH</text>
    </g>

    <!-- Subtitle: AI SOLUTIONS FOR THE FUTURE -->
    <g transform="translate(35, 510)">
      <!-- Left Horizontal Accent Line -->
      <line x1="0" y1="-8" x2="100" y2="-8" stroke="#0A1931" stroke-width="2" opacity="0.6"/>
      
      <!-- Subtitle Text -->
      <text x="125" y="0" fill="#0A1931" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" letter-spacing="9" opacity="0.95">AI SOLUTIONS FOR THE FUTURE</text>
      
      <!-- Right Horizontal Accent Line -->
      <line x1="645" y1="-8" x2="745" y2="-8" stroke="#0A1931" stroke-width="2" opacity="0.6"/>
    </g>
  </g>
</svg>
